        <div class="container"><a class="navbar-brand text-uppercase d-lg-none text-expanded" href="#">Brand</a><button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navbarResponsive"><span class="visually-hidden">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>

                </ul>
            </div>
        </div>
    </nav>
    <section class="page-section about-heading">
        <div class="container">
            <div class="card" id="TableSorterCard">
                <div class="card-header py-3">
                    <div class="row table-topper align-items-center">
                        <div class="col-12 col-sm-5 col-md-6 text-start" style="margin: 0px;padding: 5px 15px;">
                            <p class="text-primary m-0 fw-bold">Product Status Update</p>
                        </div>
                        <div class="col-12 col-sm-7 col-md-6 text-end" style="margin: 0px;padding: 5px 15px;"><button class="btn btn-warning btn-sm" id="zoom_in" type="button" zoomclick="ChangeZoomLevel(-10);" style="margin: 2px;"><i class="fa fa-search-plus"></i></button><button class="btn btn-warning btn-sm" id="zoom_out" type="button" zoomclick="ChangeZoomLevel(-10);" style="margin: 2px;"><i class="fa fa-search-minus"></i></button></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="table-responsive">
                            <table class="table table-striped table tablesorter" id="ipi-table">
                                <thead class="thead-dark">
                                    <tr>
                                        <th class="text-center">Order no</th>
                                        <th class="text-center">Customer Name</th>
                                        <th class="text-center">Product Name</th>
                                        <th class="text-center">Pack</th>
                                        <th class="text-center">Dispatched</th>
                                        <th class="text-center">Out For Delivery</th>
                                        <th class="text-center">Delivered</th>
                                        <th class="text-center filter-false sorter-false">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="text-center">
                                <tr th:each="orders : ${order}">
                                    <td th:text="${orders.id}">#1001</td>
                                    <td th:text="${orders.custName}">Customer Name</td>
                                    <td th:text="${orders.buyProductName}">Product Name</td>

                                    <td>
                                        <select th:id="'packed-' + ${orders.id}">
                                            <option value="y" th:selected="${orders.packed == 'y'}">Done</option>
                                            <option value="n" th:selected="${orders.packed != 'y'}">Not Done Yet</option>
                                        </select>
                                    </td>

                                    <td>
                                        <select th:id="'dispatch-' + ${orders.id}">
                                            <option value="y" th:selected="${orders.dispatch == 'y'}">Done</option>
                                            <option value="n" th:selected="${orders.dispatch != 'y'}">Not Done Yet</option>
                                        </select>
                                    </td>

                                    <td>
                                        <select th:id="'outForDelivery-' + ${orders.id}">
                                            <option value="y" th:selected="${orders.outForDelivery == 'y'}">Done</option>
                                            <option value="n" th:selected="${orders.outForDelivery != 'y'}">Not Done Yet</option>
                                        </select>
                                    </td>

                                    <td>
                                        <select th:id="'delivered-' + ${orders.id}">
                                            <option value="y" th:selected="${orders.delivered == 'y'}">Done</option>
                                            <option value="n" th:selected="${orders.delivered != 'y'}">Not Done Yet</option>
                                        </select>
                                    </td>

                                    <td>
                                        <button class="btn btn-success" th:attr="data-id=${orders.id}" onclick="saveOrder(this)">
                                            Save
                                        </button>
                                    </td>
                                </tr>
                                </tbody>

                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="about-heading-content"></div>
        </div>
    </section>
    <footer class="text-center footer text-faded py-5">
